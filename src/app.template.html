<title>Куда пойти на G8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --display:"Tektur","Golos Text",system-ui,sans-serif;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --bg:#FCFAF8; --surface:#FFFFFF; --surface-2:#F4F1F4; --sunk:#E3E3E3; --lilac:#C9BEC6;
  --ink:#201F1E; --ink-2:#655E63; --ink-3:#98909A;
  --line:#E2DCE2; --line-2:#C9BEC6;
  --g8:#FE2627; --lime:#D8F23F; --lime-ink:#201F1E; --pink:#FE6EC5; --plate:#201F1E; --paper:#FCFAF8;
  --tint:13%; --tint-2:26%; --shadow:0 1px 2px rgba(20,18,25,.06),0 8px 24px rgba(20,18,25,.05);
  --v-boiler:#7E6E8C; --v-kotel:#9DAE1C; --v-simple:#E23C97;
  --v-vnutri:#2E7FD1; --v-gostin:#A08A16; --v-lector:#6C7480; --v-konstr:#D8331F;
  color-scheme:light;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171516; --surface:#201F1E; --surface-2:#2A2829; --sunk:#0E0D0E; --lilac:#6E6470;
    --ink:#FCFAF8; --ink-2:#A9A2A6; --ink-3:#807880;
    --line:#332F32; --line-2:#433E42;
    --g8:#FF4B3C; --lime:#D8F23F; --pink:#FE6EC5; --plate:#0E0D0E;
    --tint:22%; --tint-2:38%; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
    --v-boiler:#B5A0C6; --v-kotel:#CBDF3E; --v-simple:#FF63B4;
    --v-vnutri:#5FA9F0; --v-gostin:#D2B62C; --v-lector:#A0A8B4; --v-konstr:#FF5A45;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171516; --surface:#201F1E; --surface-2:#2A2829; --sunk:#0E0D0E; --lilac:#6E6470;
  --ink:#FCFAF8; --ink-2:#A9A2A6; --ink-3:#807880;
  --line:#332F32; --line-2:#433E42;
  --g8:#FF4B3C; --lime:#D8F23F; --pink:#FE6EC5; --plate:#0E0D0E;
  --tint:22%; --tint-2:38%; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  --v-boiler:#B5A0C6; --v-kotel:#CBDF3E; --v-simple:#FF63B4;
  --v-vnutri:#5FA9F0; --v-gostin:#D2B62C; --v-lector:#A0A8B4; --v-konstr:#FF5A45;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; margin:0;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1360px; margin:0 auto; padding-inline:16px}
h1,h2,h3{margin:0; text-wrap:balance}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--g8); outline-offset:2px; border-radius:4px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header.top{padding-block:20px 14px; border-bottom:1px solid var(--line)}
.ticker{background:var(--plate); color:var(--paper); overflow:hidden; padding-block:7px}
.ticker__track{display:flex; width:max-content; animation:tick 80s linear infinite}
.ticker:hover .ticker__track{animation-play-state:paused}
.ticker span{font-family:var(--display); font-weight:500; font-size:11px; text-transform:uppercase;
  letter-spacing:.09em; padding-right:22px; white-space:nowrap}
@keyframes tick{from{transform:translateX(0)} to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker__track{animation:none}}
.checker{height:32px; background-repeat:repeat-x,repeat-x; background-size:64px 16px,64px 16px;
  background-position:0 0,0 16px;
  background-image:
    repeating-linear-gradient(90deg, var(--g8) 0 16px, var(--sunk) 16px 32px, var(--pink) 32px 48px, var(--lilac) 48px 64px),
    repeating-linear-gradient(90deg, var(--lilac) 0 16px, var(--pink) 16px 32px, var(--sunk) 32px 48px, var(--g8) 48px 64px)}
@media (max-width:700px){.checker{height:22px; background-size:44px 11px,44px 11px; background-position:0 0,0 11px;
  background-image:
    repeating-linear-gradient(90deg, var(--g8) 0 11px, var(--sunk) 11px 22px, var(--pink) 22px 33px, var(--lilac) 33px 44px),
    repeating-linear-gradient(90deg, var(--lilac) 0 11px, var(--pink) 11px 22px, var(--sunk) 22px 33px, var(--g8) 33px 44px)}}
.brandrow{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; justify-content:space-between}
.g8mark{display:inline-flex; align-items:center; gap:4px; font-family:var(--display); font-weight:700}
.g8mark i{width:27px; height:27px; display:grid; place-items:center; font-style:normal; font-size:15px;
  background:var(--plate); color:var(--paper);
  clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.g8mark u{text-decoration:none; font-size:12px; letter-spacing:.08em; color:var(--ink-3); margin-left:6px}
h1{font-family:var(--display); font-weight:800; font-size:clamp(27px,5.6vw,46px); line-height:1.0; letter-spacing:-.01em; margin-top:12px; text-transform:uppercase}
h1 em{font-style:normal; color:var(--g8)}
.subline{color:var(--ink-2); font-size:14px; margin-top:8px; max-width:62ch}
.subline b{color:var(--ink); font-weight:600}
.counts{display:flex; gap:18px; flex-wrap:wrap; margin-top:14px}
.count{display:flex; flex-direction:column; gap:1px}
.count .n{font-family:var(--display); font-weight:700; font-size:19px; line-height:1}
.count .l{font-family:var(--display); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3)}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:4px; margin-top:18px; background:var(--sunk); padding:4px; border-radius:10px; width:fit-content; max-width:100%; flex-wrap:wrap}
.tab{padding:8px 14px; border-radius:6px; font-family:var(--display); font-weight:500; font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-2); white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.tab .badge{display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:9px; background:var(--lime); color:var(--lime-ink); font-size:11px; font-weight:700; text-align:center}

/* ---------- toolbar ---------- */
.toolbar{position:sticky; top:0; z-index:30; background:color-mix(in srgb,var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding-block:10px}
.toolbar .wrap{display:flex; flex-direction:column; gap:9px}
.searchrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.search{flex:1 1 240px; min-width:0; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line-2); border-radius:9px; padding:8px 11px}
.search input{flex:1; min-width:0; border:none; background:none; font:inherit; color:inherit; outline:none}
.search svg{flex:none; color:var(--ink-3)}
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{
  display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 9px; border-radius:999px;
  border:1px solid var(--line-2); background:var(--surface); font-size:13px; font-weight:500; color:var(--ink-2); white-space:nowrap;
}
.chip .dot{width:9px; height:9px; border-radius:3px; background:var(--v); flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink); color:var(--ink); background:color-mix(in srgb,var(--v) var(--tint),var(--surface))}
.chip.plain[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
select.sel{background:var(--surface); border:1px solid var(--line-2); border-radius:999px; padding:6px 10px; font-size:13px; color:var(--ink-2); max-width:210px}
.hint{font-size:12px; color:var(--ink-3)}

/* ---------- grid view ---------- */
.gridwrap{
  margin-top:14px; border:1px solid var(--line); border-radius:12px; background:var(--surface);
  overflow:auto; max-height:calc(100vh - 210px); position:relative; box-shadow:var(--shadow);
}
.gridhead{display:grid; position:sticky; top:0; z-index:12; background:var(--surface-2); border-bottom:1px solid var(--line-2)}
.gridhead .hcell{padding:9px 10px; border-left:1px solid var(--line); min-width:0}
.gridhead .hcell:first-child{border-left:none; position:sticky; left:0; background:var(--surface-2); z-index:13}
.hname{font-family:var(--display); font-weight:700; text-transform:uppercase; font-size:12.5px; letter-spacing:-.01em; line-height:1.2; display:flex; gap:7px; align-items:center}
.hname .dot{width:10px; height:10px; border-radius:3px; background:var(--v); flex:none}
.hplace{font-family:var(--display); font-size:9.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); margin-top:3px; padding-left:17px}
.gridbody{display:grid; position:relative}
.gcol{position:relative; border-left:1px solid var(--line); min-width:0}
.gcol.ruler{border-left:none; position:sticky; left:0; z-index:11; background:var(--surface)}
.hourline{position:absolute; left:0; right:0; border-top:1px solid var(--line); pointer-events:none}
.hourline.half{border-top-style:dotted; opacity:.55}
.hourlab{position:absolute; right:8px; font-size:11px; color:var(--ink-3); transform:translateY(-50%)}
.ev{
  position:absolute; left:3px; right:3px; overflow:hidden; text-align:left;
  border-radius:6px; padding:4px 6px; border:1px solid transparent;
  border-left:3px solid var(--v); background:color-mix(in srgb,var(--v) var(--tint),var(--surface));
  display:block; transition:transform .1s ease;
}
.ev:hover{background:color-mix(in srgb,var(--v) var(--tint-2),var(--surface))}
.ev .t{font-size:11px; font-weight:700; color:var(--ink-2); margin-right:5px}
.ev .ti{font-family:var(--serif); font-size:12.5px; font-weight:700; line-height:1.2;
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:break-word; hyphens:auto}
.ev.break{background:repeating-linear-gradient(135deg,transparent,transparent 5px,color-mix(in srgb,var(--ink) 6%,transparent) 5px,color-mix(in srgb,var(--ink) 6%,transparent) 10px); border-left-color:var(--line-2)}
.ev.break .ti{font-weight:500; color:var(--ink-3)}
.ev.picked{border-color:var(--ink); box-shadow:inset 0 0 0 2px var(--lime)}
.ev.picked .ti::after{content:"★"; color:var(--g8); margin-left:4px}
.ev.dim{opacity:.28}
.nowline{position:absolute; left:0; right:0; height:2px; background:var(--g8); z-index:10; pointer-events:none}
.nowline::before{content:"сейчас"; position:absolute; left:4px; top:-16px; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:var(--g8); padding:1px 5px; border-radius:3px}

/* ---------- list view ---------- */
.slot{display:grid; grid-template-columns:62px 1fr; gap:12px; padding-block:12px; border-top:1px solid var(--line)}
.slot:first-child{border-top:none}
.slot .st{font-family:"JetBrains Mono",monospace; font-weight:700; font-size:15px; padding-top:9px; color:var(--ink); position:sticky; top:120px; align-self:start}
.cards{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{
  text-align:left; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--v);
  border-radius:9px; padding:11px 12px; display:flex; gap:10px; align-items:flex-start;
}
.card:hover{border-color:var(--line-2); background:color-mix(in srgb,var(--v) 6%,var(--surface))}
.card.picked{box-shadow:inset 0 0 0 2px var(--lime); border-color:var(--ink)}
.card .body{flex:1; min-width:0}
.meta{display:flex; gap:7px; align-items:center; flex-wrap:wrap; font-size:11px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em}
.meta .vn{font-family:var(--display); color:var(--v); font-weight:700; letter-spacing:.03em}
.seclabel{font-family:var(--display); font-weight:500; font-size:10px; letter-spacing:.06em;
  background:var(--plate); color:var(--v); padding:2px 6px 3px;
  clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
.card h3{font-family:var(--serif); font-size:15.5px; font-weight:700; line-height:1.24; margin-top:4px}
.card .sp{font-family:var(--serif); font-size:13.5px; color:var(--ink-2); margin-top:5px}
.card .sp b{font-weight:600; color:var(--ink)}
.star{flex:none; width:30px; height:30px; border-radius:8px; border:1px solid var(--line-2); display:grid; place-items:center; font-size:14px; color:var(--ink-3); background:var(--surface)}
.card.picked .star, .row.picked .star{background:var(--lime); color:var(--lime-ink); border-color:var(--lime)}
.kind{font-family:var(--display); font-size:9.5px; font-weight:500; padding:2px 6px; border-radius:3px; letter-spacing:.05em; text-transform:uppercase}
.kind.disc{background:color-mix(in srgb,var(--v) 20%,var(--surface)); color:var(--ink-2)}
.kind.special{background:var(--g8); color:#fff}

/* ---------- plan view ---------- */
.plan{display:flex; flex-direction:column; gap:0; margin-top:12px}
.prow{display:grid; grid-template-columns:64px 1fr; gap:12px; padding-block:12px; border-top:1px solid var(--line)}
.prow:first-child{border-top:none}
.prow .pt{font-family:"JetBrains Mono",monospace; font-weight:700; font-size:14px; padding-top:2px}
.prow .pt small{display:block; font-weight:500; color:var(--ink-3); font-size:11px}
.warn{display:flex; gap:8px; align-items:flex-start; padding:9px 12px; border-radius:9px; font-size:13px; margin-top:6px;
  background:color-mix(in srgb,var(--g8) 12%,var(--surface)); border:1px solid color-mix(in srgb,var(--g8) 35%,var(--surface)); color:var(--ink)}
.warn.walk{background:color-mix(in srgb,var(--lime) 22%,var(--surface)); border-color:color-mix(in srgb,var(--lime) 55%,var(--surface))}
.empty{text-align:center; padding:56px 20px; color:var(--ink-2); max-width:46ch; margin:0 auto}
.empty h2{font-family:var(--display); font-size:18px; text-transform:uppercase; margin-bottom:8px}
.planbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px}
.btn{border:1px solid var(--line-2); background:var(--surface); padding:8px 14px; border-radius:7px; font-family:var(--display); font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:.04em}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}


/* ---------- экспорт плана в картинку и PDF ---------- */
const EX = {W:1080, PAD:64, TCOL:150, A4:1527};
const VEXPORT = {boiler:'#7E6E8C', kotel:'#8A9A18', simple:'#E23C97', vnutri:'#2E7FD1',
                 gostin:'#A08A16', lector:'#6C7480', konstr:'#D8331F'};
function wrapText(ctx, text, maxW, font){
  ctx.font = font;
  const out=[]; let line='';
  for(const word of String(text).split(/\s+/)){
    const test = line ? line+' '+word : word;
    if(ctx.measureText(test).width <= maxW || !line) line = test;
    else { out.push(line); line = word; }
  }
  if(line) out.push(line);
  return out;
}
function planWarning(prev, e){
  if(!prev) return null;
  const v=V[e.venue], pv=V[prev.venue];
  if(e.startMin < prev.endMin) return {t:`Накладка с «${prev.title}» (до ${prev.end}, ${pv.name})`, c:'red'};
  if(pv.place!==v.place && e.startMin-prev.endMin < 10) return {t:`Переход ${pv.place} → ${v.place} за ${e.startMin-prev.endMin} мин`, c:'lime'};
  if(e.startMin-prev.endMin >= 45) return {t:`Окно ${e.startMin-prev.endMin} мин`, c:'grey'};
  return null;
}
function buildBlocks(picks, scale){
  const ctx = document.createElement('canvas').getContext('2d');
  const cw = (EX.W - EX.PAD*2 - EX.TCOL) / scale;
  const blocks=[];
  picks.forEach((e,i)=>{
    const w = planWarning(picks[i-1], e);
    if(w){
      const wl = wrapText(ctx, (w.c==='red'?'⚠ ':w.c==='lime'?'→ ':'· ')+w.t, cw, `600 22px "Golos Text",system-ui,sans-serif`);
      blocks.push({type:'warn', ...w, lines:wl, h: wl.length*28 + 22});
    }
    const titleLines = wrapText(ctx, e.title, cw, `700 30px "PT Serif",Georgia,serif`);
    const spText = e.speakers.map(s=>s.name).join(', ');
    const spLines = spText ? wrapText(ctx, spText, cw, `400 24px "PT Serif",Georgia,serif`).slice(0,2) : [];
    blocks.push({type:'ev', e, titleLines, spLines,
      h: 34 + titleLines.length*38 + (spLines.length ? spLines.length*30 + 8 : 0) + 26});
  });
  return blocks;
}
function drawPages(picks, pageH, scale){
  const blocks = buildBlocks(picks, scale);
  const headH = 250, contH = 96, footH = 70;
  const pages=[]; let cur=[], y=headH;
  blocks.forEach(b=>{
    if(pageH && y + b.h > pageH - footH && cur.length){ pages.push(cur); cur=[]; y=contH; }
    cur.push(b); y += b.h;
  });
  if(cur.length) pages.push(cur);
  const total = pages.length;
  return pages.map((items,pi)=>{
    const top = pi===0 ? headH : contH;
    const H = pageH || (top + items.reduce((a,b)=>a+b.h,0) + footH);
    const cv = document.createElement('canvas');
    cv.width = EX.W; cv.height = Math.round(H*scale);
    const c = cv.getContext('2d');
    c.scale(scale, scale);
    const W = EX.W/scale, P = EX.PAD/scale, TC = EX.TCOL/scale, HH = H;
    c.fillStyle='#FFFFFF'; c.fillRect(0,0,W,HH);
    c.textBaseline='alphabetic';
    if(pi===0){
      c.fillStyle='#E22318'; roundRect(c,P,58,168,46,7); c.fill();
      c.fillStyle='#fff'; c.font=`700 21px "Tektur","Golos Text",sans-serif`; c.fillText('G8 · 2026', P+18, 88);
      c.fillStyle='#15141A'; c.font=`800 50px "Tektur","Golos Text",sans-serif`;
      c.fillText('МОЙ ПЛАН НА ФЕСТИВАЛЕ', P, 168);
      const last = picks[picks.length-1];
      c.fillStyle='#5B5765'; c.font=`400 25px "Golos Text",system-ui,sans-serif`;
      c.fillText(`${DATA.festival.dateLabel} · ${plural(picks.length,'событие','события','событий')} · с ${picks[0].start} до ${last.end||last.start}`, P, 212);
      c.fillStyle='#DAD5CE'; c.fillRect(P, 238, W-P*2, 1);
    } else {
      c.fillStyle='#8C8796'; c.font=`500 20px "Tektur","Golos Text",sans-serif`;
      c.fillText('МОЙ ПЛАН НА ФЕСТИВАЛЕ G8 — ПРОДОЛЖЕНИЕ', P, 56);
      c.fillStyle='#DAD5CE'; c.fillRect(P, 74, W-P*2, 1);
    }
    let y = top;
    items.forEach(b=>{
      if(b.type==='warn'){
        const col = b.c==='red' ? '#E22318' : b.c==='lime' ? '#7A8A12' : '#8C8796';
        c.fillStyle=col; c.font=`600 22px "Golos Text",system-ui,sans-serif`;
        b.lines.forEach((l,i)=>c.fillText(l, P+TC, y+26+i*28));
        y += b.h; return;
      }
      const e=b.e, v=V[e.venue];
      const col = VEXPORT[e.venue] || '#5B5765';
      c.fillStyle=col; c.fillRect(P+TC-26, y+8, 5, b.h-24);
      c.fillStyle='#15141A'; c.font=`700 28px "JetBrains Mono",monospace`; c.fillText(e.start, P, y+34);
      c.fillStyle='#8C8796'; c.font=`500 21px "JetBrains Mono",monospace`; c.fillText(e.end||'', P, y+62);
      c.fillStyle=col; c.font=`700 18px "Tektur","Golos Text",sans-serif`;
      c.fillText((v.name+(e.section?' · '+e.section:'')).toUpperCase(), P+TC, y+26);
      c.fillStyle='#15141A'; c.font=`700 30px "PT Serif",Georgia,serif`;
      b.titleLines.forEach((l,i)=>c.fillText(l, P+TC, y+64+i*38));
      if(b.spLines.length){
        c.fillStyle='#5B5765'; c.font=`400 24px "PT Serif",Georgia,serif`;
        b.spLines.forEach((l,i)=>c.fillText(l, P+TC, y+64+b.titleLines.length*38+16+i*30));
      }
      y += b.h;
      c.fillStyle='#EBE7E1'; c.fillRect(P+TC, y-13, W-P-TC, 1);
    });
    c.fillStyle='#8C8796'; c.font=`400 20px "Golos Text",system-ui,sans-serif`;
    c.fillText('G8 «Креативный фудкорт» · Хлебозавод + Дизайн-завод · g8.art', P, HH-30);
    if(total>1){ c.textAlign='right'; c.fillText(`${pi+1} / ${total}`, W-P, HH-30); c.textAlign='left'; }
    return cv;
  });
}
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function loadScript(src){
  return new Promise((res,rej)=>{ const t=document.createElement('script'); t.src=src; t.onload=res; t.onerror=rej; document.head.appendChild(t); });
}
async function exportPlan(kind, btn){
  const picks=[...state.plan].map(id=>byId[id]).filter(Boolean).sort((a,b)=>a.startMin-b.startMin);
  if(!picks.length) return;
  const label = btn.textContent; btn.textContent = 'Готовлю…'; btn.disabled = true;
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    let blob, filename;
    if(kind==='png'){
      const rough = buildBlocks(picks,1).reduce((a,b)=>a+b.h,0) + 320;
      const scale = rough > 13000 ? 0.72 : 1;
      const cv = drawPages(picks, null, scale)[0];
      blob = await new Promise(r=>cv.toBlob(r,'image/png'));
      filename = 'G8-2026-plan.png';
      showExport(cv.toDataURL('image/png'), blob, filename, 'png');
    } else {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js');
      const pages = drawPages(picks, EX.A4, 1);
      const doc = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
      pages.forEach((cv,i)=>{ if(i) doc.addPage();
        doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,595.28,841.89); });
      blob = doc.output('blob');
      filename = 'G8-2026-plan.pdf';
      const dl = await (window.claude?.use?.('downloads') ?? Promise.resolve(null));
      if(dl){ try{ await dl.save({filename, data:blob}); } catch(err){ if(err?.code!=='declined') openBlob(blob); } }
      else openBlob(blob);
    }
  }catch(err){ alert('Не получилось собрать файл: '+(err&&err.message||err)); }
  finally{ btn.textContent = label; btn.disabled = false; }
}
function openBlob(blob){ const u=URL.createObjectURL(blob); window.open(u,'_blank'); setTimeout(()=>URL.revokeObjectURL(u),60000); }
async function showExport(dataUrl, blob, filename){
  const sheet=document.getElementById('sheet');
  sheet.innerHTML = `<button class="close" id="closeSheet" aria-label="Закрыть">✕</button>
    <h2 style="font-size:19px">Расписание картинкой</h2>
    <p class="hint" style="margin:8px 0 12px">Нажмите «Сохранить» — файл уйдёт в системное меню сохранения. На айфоне можно и проще: долгое нажатие на картинку → «Добавить в Фото».</p>
    <img src="${dataUrl}" alt="Моё расписание G8" style="width:100%; border:1px solid var(--line); border-radius:8px">
    <div class="act"><button class="btn primary" id="dlNow">Сохранить</button></div>`;
  sheet.classList.add('open'); document.getElementById('scrim').classList.add('open');
  sheet.scrollTop=0;
  document.getElementById('closeSheet').onclick=closeSheet;
  document.getElementById('dlNow').onclick=async (ev)=>{
    const b=ev.currentTarget;
    const dl = await (window.claude?.use?.('downloads') ?? Promise.resolve(null));
    if(!dl){ openBlob(blob); return; }
    try{ await dl.save({filename, data:blob}); b.textContent='Сохранено'; }
    catch(err){ if(err?.code==='declined'){ b.textContent='Сохранить'; } else { openBlob(blob); } }
  };
}

<script>
const DATA = /*__DATA__*/;
const V = {}; DATA.venues.forEach(v=>V[v.id]=v);
const VCOLOR = id => `var(--v-${id})`;
const EV = DATA.events;
const byId = {}; EV.forEach(e=>byId[e.id]=e);
const CONTENT = EV.filter(e=>e.kind!=='break');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural = (n, one, few, many) => {
  const n10=n%10, n100=n%100;
  return n + ' ' + (n10===1 && n100!==11 ? one : (n10>=2 && n10<=4 && (n100<12||n100>14) ? few : many));
};
const hhmm = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

const state = {
  view: window.innerWidth < 700 ? 'list' : 'grid', q:'', section:'', venues:new Set(), breaks:true, onlyPlan:false,
  plan:new Set(), open:null
};

/* ---------- persistence: db when available, localStorage otherwise ---------- */
const LS='g8-2026-plan';
let dbDoc=null, writing=false;
try{ const raw=localStorage.getItem(LS); if(raw) JSON.parse(raw).forEach(id=>{ if(byId[id] && byId[id].kind!=='break') state.plan.add(id); }); }catch(e){}
function savePlan(){
  const ids=[...state.plan];
  try{ localStorage.setItem(LS, JSON.stringify(ids)); }catch(e){}
  if(dbDoc){ writing=true; dbDoc.set({ids, updated:Date.now()}).catch(()=>{}).finally(()=>{writing=false;}); }
}
(async()=>{
  const db = await (window.claude?.use?.('db') ?? Promise.resolve(null));
  if(!db) return;
  try{
    dbDoc = db.doc('plan/main');
    const snap = await dbDoc.get();
    if(snap && Array.isArray(snap.ids)){
      const merged=new Set([...state.plan, ...snap.ids.filter(id=>byId[id])]);
      state.plan=merged; savePlan(); render();
    } else if(state.plan.size){ savePlan(); }
    dbDoc.onSnapshot(d=>{
      if(writing || !d || !Array.isArray(d.ids)) return;
      state.plan=new Set(d.ids.filter(id=>byId[id]));
      try{ localStorage.setItem(LS, JSON.stringify([...state.plan])); }catch(e){}
      render();
    });
  }catch(e){ dbDoc=null; }
})();

/* ---------- now marker ---------- */
function nowMin(){
  const d=new Date();
  const today = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(today!==DATA.festival.date) return null;
  const m=d.getHours()*60+d.getMinutes();
  return (m>=T0 && m<=T1) ? m : null;
}

/* ---------- filters ---------- */
function matches(e){
  if(!state.breaks && e.kind==='break') return false;
  if(state.onlyPlan && !state.plan.has(e.id)) return false;
  if(state.venues.size && !state.venues.has(e.venue)) return false;
  if(state.section && e.section!==state.section) return false;
  if(state.q){
    const q=state.q.toLowerCase();
    const hay=(e.title+' '+(e.section||'')+' '+(e.curator||'')+' '+e.speakers.map(s=>s.name+' '+s.role).join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
const filtering = () => state.q || state.section || state.venues.size || state.onlyPlan;

/* ---------- header ---------- */
const T0=480, T1=1290, PAD=14;
const narrow = () => window.innerWidth < 700;
function header(){
  const f=DATA.festival;
  const speakers = new Set(EV.flatMap(e=>e.speakers.map(s=>s.name))).size;
  const line = ['11 сентября','Креофудкорт G8','Хлебозавод и Дизайн-завод',
    plural(CONTENT.length,'событие','события','событий')+' в 7 залах',
    plural(speakers,'спикер','спикера','спикеров'),
    'Церемония награждения 19:00','Вечеринка от Resonance Moscow 23:00'];
  const once = line.map(t=>`<span>${esc(t)}&nbsp;&nbsp;⟶</span>`).join('');
  document.getElementById('tickerTrack').innerHTML = once + once;
  document.getElementById('subline').innerHTML = narrow()
    ? `<b>${esc(f.dateLabel)}</b> · ${plural(CONTENT.length,'событие','события','событий')} в 7 залах. Отмечайте ★ — план соберётся во вкладке «Мой план».`
    : `<b>${esc(f.dateLabel)}</b> · ${f.places.map(p=>esc(p.name)).join(' + ')} · ${plural(CONTENT.length,'событие','события','событий')} в 7 залах параллельно. `+
      `Отмечайте звёздочкой то, что хотите — план соберётся во вкладке «Мой план» и предупредит о накладках.`;
  document.getElementById('counts').innerHTML =
    [[CONTENT.length,'событий'],[7,'залов'],[DATA.sections.length,'секций'],
     [speakers,'спикеров']]
    .map(([n,l])=>`<div class="count"><span class="n mono">${n}</span><span class="l">${l}</span></div>`).join('');
  document.getElementById('footnote').innerHTML =
    `Расписание собрано из официальной PDF-программы фестиваля <a href="${esc(f.site)}" target="_blank" rel="noopener">G8</a> — «${esc(f.edition)}», ${esc(f.dateLabel)}. ${esc(f.places[0].note)}. `+
    `Церемония награждения ${esc(f.ceremony.time)}, ${esc(f.ceremony.place)} (${esc(f.ceremony.note)}). Афтепати ${esc(f.afterparty.time)}, ${esc(f.afterparty.place)} — ${esc(f.afterparty.note)}. `+
    `Организаторы могут менять программу: сверяйтесь на месте.`;
}

/* ---------- controls ---------- */
function controls(){
  document.getElementById('venueChips').innerHTML = DATA.venues.map(v=>
    `<button class="chip" data-venue="${v.id}" style="--v:${VCOLOR(v.id)}" aria-pressed="${state.venues.has(v.id)}">
       <span class="dot"></span>${esc(v.name)}<span class="hint">${esc(v.place)}</span></button>`).join('');
  const sel=document.getElementById('sectionSel');
  if(!sel.options.length){
    sel.innerHTML = `<option value="">Все секции</option>` + DATA.sections.map(s=>
      `<option value="${esc(s.name)}">${esc(s.name)} — ${esc(V[s.venue].name)}</option>`).join('');
  }
  document.getElementById('planBadge').textContent = state.plan.size;
}

/* ---------- grid ---------- */
function renderGrid(){
  const PPM = narrow() ? 3.4 : 2.6;
  const cols = DATA.venues.filter(v=>!state.venues.size || state.venues.has(v.id));
  const tpl = `${narrow()?50:76}px repeat(${cols.length}, minmax(${narrow()?170:160}px,1fr))`;
  const H = (T1-T0)*PPM + PAD*2;
  let lines='';
  for(let m=T0;m<=T1;m+=30){
    lines += `<div class="hourline${m%60?' half':''}" style="top:${(m-T0)*PPM+PAD}px"></div>`;
  }
  let ruler='';
  for(let m=T0;m<=T1;m+=60) ruler += `<div class="hourlab mono" style="top:${(m-T0)*PPM+PAD}px">${hhmm(m)}</div>`;
  const nm=nowMin();
  const now = nm!==null ? `<div class="nowline" style="top:${(nm-T0)*PPM+PAD}px"></div>` : '';

  const body = cols.map(v=>{
    const evs = EV.filter(e=>e.venue===v.id && (state.breaks || e.kind!=='break'));
    return `<div class="gcol" style="--v:${VCOLOR(v.id)}">${lines}` + evs.map(e=>{
      const top=(e.startMin-T0)*PPM+PAD, h=Math.max(24,(e.endMin-e.startMin)*PPM-4);
      const dim = filtering() && !matches(e) ? ' dim':'';
      const cls = `ev${e.kind==='break'?' break':''}${state.plan.has(e.id)?' picked':''}${dim}`;
      const tag = e.kind==='break' ? 'div' : 'button';
      const at  = e.kind==='break' ? '' : ` data-ev="${e.id}"`;
      const lines = Math.max(1, Math.floor((h - 11) / 15));
      return `<${tag} class="${cls}"${at} style="top:${top}px;height:${h}px">
        <span class="ti" style="-webkit-line-clamp:${lines}"><span class="t mono">${e.start}</span>${esc(e.title.replace(/\.$/,""))}</span></${tag}>`;
    }).join('') + `</div>`;
  }).join('');

  document.getElementById('view-grid').innerHTML = `
    <div class="gridwrap" id="gridwrap">
      <div class="gridhead" style="grid-template-columns:${tpl}">
        <div class="hcell"></div>
        ${cols.map(v=>`<div class="hcell" style="--v:${VCOLOR(v.id)}">
            <div class="hname"><span class="dot"></span>${esc(v.name)}</div>
            <div class="hplace">${esc(v.place)}</div></div>`).join('')}
      </div>
      <div class="gridbody" style="grid-template-columns:${tpl}; height:${H}px">
        <div class="gcol ruler">${lines}${ruler}</div>
        ${body}
        ${now}
      </div>
    </div>
    <p class="hint" style="margin-top:8px">Столбцы — залы, вертикаль — время. Клик по блоку открывает описание и ставит его в план. ${nm!==null?'Красная линия — текущее время.':''}</p>`;
  if(nm!==null){
    const w=document.getElementById('gridwrap');
    w.scrollTop=Math.max(0,(nm-T0)*PPM+PAD-140);
  }
}

/* ---------- list ---------- */
function renderList(){
  const evs = EV.filter(matches).sort((a,b)=>a.startMin-b.startMin || a.venue.localeCompare(b.venue));
  const el=document.getElementById('view-list');
  if(!evs.length){ el.innerHTML=`<div class="empty"><h2>Ничего не нашлось</h2><p>Смягчите фильтры или поищите другое слово.</p></div>`; return; }
  const slots=[]; let cur=null;
  evs.forEach(e=>{ if(!cur || cur.t!==e.start){ cur={t:e.start, items:[]}; slots.push(cur);} cur.items.push(e); });
  el.innerHTML = `<div style="margin-top:6px">` + slots.map(s=>`
    <div class="slot">
      <div class="st mono">${s.t}</div>
      <div class="cards">${s.items.map(cardHTML).join('')}</div>
    </div>`).join('') + `</div>`;
}
function cardHTML(e){
  const v=V[e.venue];
  const sp = e.speakers.length
    ? `<div class="sp">${e.speakers.slice(0,3).map(s=>`<b>${esc(s.name)}</b>${s.role?' — '+esc(s.role.split(',')[0]):''}`).join('<br>')}${e.speakers.length>3?`<br>+ ещё ${e.speakers.length-3}`:''}</div>`
    : '';
  const kind = e.kind==='disc'?`<span class="kind disc">дискуссия</span>`
             : e.kind==='special'?`<span class="kind special">спецпоказ</span>`:'';
  if(e.kind==='break') return `<div class="card break" style="--v:${VCOLOR(e.venue)}">
    <div class="body"><div class="meta"><span class="vn">${esc(v.name)}</span><span class="mono">${e.start}–${e.end||''}</span></div>
    <h3 style="font-weight:500;color:var(--ink-3)">${esc(e.title)}</h3></div></div>`;
  return `<button class="card${state.plan.has(e.id)?' picked':''}" data-ev="${e.id}" style="--v:${VCOLOR(e.venue)}">
    <div class="body">
      <div class="meta"><span class="vn">${esc(v.name)}</span>${e.section?`<span class="seclabel">${esc(e.section)}</span>`:''}${kind}<span class="mono">${e.start}–${e.end||''}</span></div>
      <h3>${esc(e.title)}</h3>${sp}
    </div>
    <span class="star" aria-hidden="true">${state.plan.has(e.id)?'★':'☆'}</span>
  </button>`;
}

/* ---------- plan ---------- */
function renderPlan(){
  const el=document.getElementById('view-plan');
  const picks=[...state.plan].map(id=>byId[id]).filter(Boolean).sort((a,b)=>a.startMin-b.startMin);
  if(!picks.length){
    el.innerHTML = `<div class="empty"><h2>План пока пустой</h2>
      <p>Откройте «Сетку залов» или «Списком» и отмечайте звёздочкой то, что цепляет. Здесь всё выстроится по времени, а накладки и переходы между площадками подсветятся.</p></div>`;
    return;
  }
  let html='<div class="plan">';
  picks.forEach((e,i)=>{
    const v=V[e.venue], prev=picks[i-1];
    if(prev){
      if(e.startMin < prev.endMin){
        html += `<div class="warn">⚠ Накладка: «${esc(prev.title)}» идёт до ${prev.end} в зале ${esc(V[prev.venue].name)}. Придётся выбрать.</div>`;
      } else if(V[prev.venue].place!==v.place && e.startMin-prev.endMin < 10){
        html += `<div class="warn walk">🚶 Переход ${esc(V[prev.venue].place)} → ${esc(v.place)} за ${e.startMin-prev.endMin} мин. Соседние площадки, но заложите 5–7 минут.</div>`;
      } else if(e.startMin-prev.endMin >= 45){
        html += `<div class="warn walk">☕ Окно ${e.startMin-prev.endMin} мин — время на фудкорт, ярмарку или нетворкинг.</div>`;
      }
    }
    html += `<div class="prow">
      <div class="pt mono">${e.start}<small>${e.end||''}</small></div>
      <div>${cardHTML(e)}</div>
    </div>`;
  });
  html += '</div>';
  const last=picks[picks.length-1];
  html += `<div class="planbar">
      <button class="btn primary" id="savePng">Сохранить картинкой</button>
      <button class="btn" id="savePdf">PDF</button>
      <button class="btn" id="copyPlan">Скопировать текстом</button>
      <button class="btn" id="clearPlan">Очистить план</button>
      <span class="hint">${plural(picks.length,'событие','события','событий')} · с ${picks[0].start} до ${last.end||last.start}</span>
    </div>`;
  el.innerHTML=html;
  document.getElementById('savePng').onclick = e => exportPlan('png', e.currentTarget);
  document.getElementById('savePdf').onclick = e => exportPlan('pdf', e.currentTarget);
  document.getElementById('clearPlan').onclick=()=>{ if(confirm('Убрать все отмеченные события?')){ state.plan.clear(); savePlan(); render(); } };
  document.getElementById('copyPlan').onclick=async()=>{
    const txt = 'Мой G8, '+DATA.festival.dateLabel+'\n\n' + picks.map(e=>
      `${e.start}–${e.end||''} · ${V[e.venue].name} (${V[e.venue].place})\n${e.title}` +
      (e.speakers.length?`\n${e.speakers.map(s=>s.name).join(', ')}`:'')).join('\n\n');
    try{ await navigator.clipboard.writeText(txt); const b=document.getElementById('copyPlan'); b.textContent='Скопировано'; setTimeout(()=>b.textContent='Скопировать текстом',1600);}catch(err){ alert(txt); }
  };
}


/* ---------- экспорт плана в картинку и PDF ---------- */
const EX = {W:1080, PAD:64, TCOL:150, A4:1527};
const VEXPORT = {boiler:'#7E6E8C', kotel:'#8A9A18', simple:'#E23C97', vnutri:'#2E7FD1',
                 gostin:'#A08A16', lector:'#6C7480', konstr:'#D8331F'};
function wrapText(ctx, text, maxW, font){
  ctx.font = font;
  const out=[]; let line='';
  for(const word of String(text).split(/\s+/)){
    const test = line ? line+' '+word : word;
    if(ctx.measureText(test).width <= maxW || !line) line = test;
    else { out.push(line); line = word; }
  }
  if(line) out.push(line);
  return out;
}
function planWarning(prev, e){
  if(!prev) return null;
  const v=V[e.venue], pv=V[prev.venue];
  if(e.startMin < prev.endMin) return {t:`Накладка с «${prev.title}» (до ${prev.end}, ${pv.name})`, c:'red'};
  if(pv.place!==v.place && e.startMin-prev.endMin < 10) return {t:`Переход ${pv.place} → ${v.place} за ${e.startMin-prev.endMin} мин`, c:'lime'};
  if(e.startMin-prev.endMin >= 45) return {t:`Окно ${e.startMin-prev.endMin} мин`, c:'grey'};
  return null;
}
function buildBlocks(picks, scale){
  const ctx = document.createElement('canvas').getContext('2d');
  const cw = (EX.W - EX.PAD*2 - EX.TCOL) / scale;
  const blocks=[];
  picks.forEach((e,i)=>{
    const w = planWarning(picks[i-1], e);
    if(w){
      const wl = wrapText(ctx, (w.c==='red'?'⚠ ':w.c==='lime'?'→ ':'· ')+w.t, cw, `600 22px "Golos Text",system-ui,sans-serif`);
      blocks.push({type:'warn', ...w, lines:wl, h: wl.length*28 + 22});
    }
    const titleLines = wrapText(ctx, e.title, cw, `700 30px "PT Serif",Georgia,serif`);
    const spText = e.speakers.map(s=>s.name).join(', ');
    const spLines = spText ? wrapText(ctx, spText, cw, `400 24px "PT Serif",Georgia,serif`).slice(0,2) : [];
    blocks.push({type:'ev', e, titleLines, spLines,
      h: 34 + titleLines.length*38 + (spLines.length ? spLines.length*30 + 8 : 0) + 26});
  });
  return blocks;
}
function drawPages(picks, pageH, scale){
  const blocks = buildBlocks(picks, scale);
  const headH = 250, contH = 96, footH = 70;
  const pages=[]; let cur=[], y=headH;
  blocks.forEach(b=>{
    if(pageH && y + b.h > pageH - footH && cur.length){ pages.push(cur); cur=[]; y=contH; }
    cur.push(b); y += b.h;
  });
  if(cur.length) pages.push(cur);
  const total = pages.length;
  return pages.map((items,pi)=>{
    const top = pi===0 ? headH : contH;
    const H = pageH || (top + items.reduce((a,b)=>a+b.h,0) + footH);
    const cv = document.createElement('canvas');
    cv.width = EX.W; cv.height = Math.round(H*scale);
    const c = cv.getContext('2d');
    c.scale(scale, scale);
    const W = EX.W/scale, P = EX.PAD/scale, TC = EX.TCOL/scale, HH = H;
    c.fillStyle='#FFFFFF'; c.fillRect(0,0,W,HH);
    c.textBaseline='alphabetic';
    if(pi===0){
      c.fillStyle='#E22318'; roundRect(c,P,58,168,46,7); c.fill();
      c.fillStyle='#fff'; c.font=`700 21px "Tektur","Golos Text",sans-serif`; c.fillText('G8 · 2026', P+18, 88);
      c.fillStyle='#15141A'; c.font=`800 50px "Tektur","Golos Text",sans-serif`;
      c.fillText('МОЙ ПЛАН НА ФЕСТИВАЛЕ', P, 168);
      const last = picks[picks.length-1];
      c.fillStyle='#5B5765'; c.font=`400 25px "Golos Text",system-ui,sans-serif`;
      c.fillText(`${DATA.festival.dateLabel} · ${plural(picks.length,'событие','события','событий')} · с ${picks[0].start} до ${last.end||last.start}`, P, 212);
      c.fillStyle='#DAD5CE'; c.fillRect(P, 238, W-P*2, 1);
    } else {
      c.fillStyle='#8C8796'; c.font=`500 20px "Tektur","Golos Text",sans-serif`;
      c.fillText('МОЙ ПЛАН НА ФЕСТИВАЛЕ G8 — ПРОДОЛЖЕНИЕ', P, 56);
      c.fillStyle='#DAD5CE'; c.fillRect(P, 74, W-P*2, 1);
    }
    let y = top;
    items.forEach(b=>{
      if(b.type==='warn'){
        const col = b.c==='red' ? '#E22318' : b.c==='lime' ? '#7A8A12' : '#8C8796';
        c.fillStyle=col; c.font=`600 22px "Golos Text",system-ui,sans-serif`;
        b.lines.forEach((l,i)=>c.fillText(l, P+TC, y+26+i*28));
        y += b.h; return;
      }
      const e=b.e, v=V[e.venue];
      const col = VEXPORT[e.venue] || '#5B5765';
      c.fillStyle=col; c.fillRect(P+TC-26, y+8, 5, b.h-24);
      c.fillStyle='#15141A'; c.font=`700 28px "JetBrains Mono",monospace`; c.fillText(e.start, P, y+34);
      c.fillStyle='#8C8796'; c.font=`500 21px "JetBrains Mono",monospace`; c.fillText(e.end||'', P, y+62);
      c.fillStyle=col; c.font=`700 18px "Tektur","Golos Text",sans-serif`;
      c.fillText((v.name+(e.section?' · '+e.section:'')).toUpperCase(), P+TC, y+26);
      c.fillStyle='#15141A'; c.font=`700 30px "PT Serif",Georgia,serif`;
      b.titleLines.forEach((l,i)=>c.fillText(l, P+TC, y+64+i*38));
      if(b.spLines.length){
        c.fillStyle='#5B5765'; c.font=`400 24px "PT Serif",Georgia,serif`;
        b.spLines.forEach((l,i)=>c.fillText(l, P+TC, y+64+b.titleLines.length*38+16+i*30));
      }
      y += b.h;
      c.fillStyle='#EBE7E1'; c.fillRect(P+TC, y-13, W-P-TC, 1);
    });
    c.fillStyle='#8C8796'; c.font=`400 20px "Golos Text",system-ui,sans-serif`;
    c.fillText('G8 «Креативный фудкорт» · Хлебозавод + Дизайн-завод · g8.art', P, HH-30);
    if(total>1){ c.textAlign='right'; c.fillText(`${pi+1} / ${total}`, W-P, HH-30); c.textAlign='left'; }
    return cv;
  });
}
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function loadScript(src){
  return new Promise((res,rej)=>{ const t=document.createElement('script'); t.src=src; t.onload=res; t.onerror=rej; document.head.appendChild(t); });
}
async function exportPlan(kind, btn){
  const picks=[...state.plan].map(id=>byId[id]).filter(Boolean).sort((a,b)=>a.startMin-b.startMin);
  if(!picks.length) return;
  const label = btn.textContent; btn.textContent = 'Готовлю…'; btn.disabled = true;
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    let blob, filename;
    if(kind==='png'){
      const rough = buildBlocks(picks,1).reduce((a,b)=>a+b.h,0) + 320;
      const scale = rough > 13000 ? 0.72 : 1;
      const cv = drawPages(picks, null, scale)[0];
      blob = await new Promise(r=>cv.toBlob(r,'image/png'));
      filename = 'G8-2026-plan.png';
      showExport(cv.toDataURL('image/png'), blob, filename, 'png');
    } else {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js');
      const pages = drawPages(picks, EX.A4, 1);
      const doc = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
      pages.forEach((cv,i)=>{ if(i) doc.addPage();
        doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,595.28,841.89); });
      blob = doc.output('blob');
      filename = 'G8-2026-plan.pdf';
      const dl = await (window.claude?.use?.('downloads') ?? Promise.resolve(null));
      if(dl){ try{ await dl.save({filename, data:blob}); } catch(err){ if(err?.code!=='declined') openBlob(blob); } }
      else openBlob(blob);
    }
  }catch(err){ alert('Не получилось собрать файл: '+(err&&err.message||err)); }
  finally{ btn.textContent = label; btn.disabled = false; }
}
function openBlob(blob){ const u=URL.createObjectURL(blob); window.open(u,'_blank'); setTimeout(()=>URL.revokeObjectURL(u),60000); }
async function showExport(dataUrl, blob, filename){
  const sheet=document.getElementById('sheet');
  sheet.innerHTML = `<button class="close" id="closeSheet" aria-label="Закрыть">✕</button>
    <h2 style="font-size:19px">Расписание картинкой</h2>
    <p class="hint" style="margin:8px 0 12px">Нажмите «Сохранить» — файл уйдёт в системное меню сохранения. На айфоне можно и проще: долгое нажатие на картинку → «Добавить в Фото».</p>
    <img src="${dataUrl}" alt="Моё расписание G8" style="width:100%; border:1px solid var(--line); border-radius:8px">
    <div class="act"><button class="btn primary" id="dlNow">Сохранить</button></div>`;
  sheet.classList.add('open'); document.getElementById('scrim').classList.add('open');
  sheet.scrollTop=0;
  document.getElementById('closeSheet').onclick=closeSheet;
  document.getElementById('dlNow').onclick=async (ev)=>{
    const b=ev.currentTarget;
    const dl = await (window.claude?.use?.('downloads') ?? Promise.resolve(null));
    if(!dl){ openBlob(blob); return; }
    try{ await dl.save({filename, data:blob}); b.textContent='Сохранено'; }
    catch(err){ if(err?.code==='declined'){ b.textContent='Сохранить'; } else { openBlob(blob); } }
  };
}

/* ---------- sheet ---------- */
function openSheet(id){
  const e=byId[id]; if(!e) return;
  state.open=id;
  const v=V[e.venue];
  const parallel = EV.filter(x=>x.id!==e.id && x.kind!=='break' && x.startMin < e.endMin && x.endMin > e.startMin)
    .sort((a,b)=>a.startMin-b.startMin);
  document.getElementById('sheet').innerHTML = `
    <button class="close" id="closeSheet" aria-label="Закрыть">✕</button>
    <span class="vtag" style="--v:${VCOLOR(e.venue)}"><span class="dot"></span>${esc(v.name)}</span>
    <h2>${esc(e.title)}</h2>
    <div class="when mono">${e.start}${e.end?' – '+e.end:''}</div>
    <div class="where">${esc(v.place)}${e.section?` · секция «${esc(e.section)}»`:''}${e.curator?` · куратор: ${esc(e.curator)}`:''}</div>
    ${e.speakers.length?`<div class="splist">${e.speakers.map(s=>
       `<div class="sp-item"><b>${esc(s.name)}</b>${s.role?`<span>${esc(s.role)}</span>`:''}</div>`).join('')}</div>`:''}
    <div class="act">
      <button class="btn primary" id="togglePick">${state.plan.has(e.id)?'★ Убрать из плана':'☆ В мой план'}</button>
    </div>
    ${parallel.length?`<div class="parallel"><h4>В это же время в других залах — ${parallel.length}</h4>
      ${parallel.map(p=>`<button class="pl" data-ev="${p.id}" style="--v:${VCOLOR(p.venue)}">
        <span class="vn">${esc(V[p.venue].name)}</span> <span class="mono">${p.start}</span><br><b>${esc(p.title)}</b></button>`).join('')}</div>`:''}
  `;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('scrim').classList.add('open');
  document.getElementById('closeSheet').onclick=closeSheet;
  document.getElementById('togglePick').onclick=()=>{ toggle(e.id); openSheet(e.id); };
  document.getElementById('sheet').scrollTop=0;
}
function closeSheet(){
  state.open=null;
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}
function toggle(id){
  if(state.plan.has(id)) state.plan.delete(id); else state.plan.add(id);
  savePlan(); render();
}

/* ---------- render ---------- */
function render(){
  controls();
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.dataset.view===state.view)));
  ['grid','list','plan'].forEach(v=>document.getElementById('view-'+v).hidden = v!==state.view);
  if(state.view==='grid') renderGrid();
  if(state.view==='list') renderList();
  if(state.view==='plan') renderPlan();
}

/* ---------- events ---------- */
document.addEventListener('click', ev=>{
  const tab=ev.target.closest('.tab');
  if(tab){ state.view=tab.dataset.view; render(); return; }
  const chip=ev.target.closest('[data-venue]');
  if(chip){ const id=chip.dataset.venue; state.venues.has(id)?state.venues.delete(id):state.venues.add(id); render(); return; }
  const star=ev.target.closest('.star');
  if(star){ const c=star.closest('[data-ev]'); if(c){ ev.stopPropagation(); toggle(c.dataset.ev); return; } }
  const item=ev.target.closest('[data-ev]');
  if(item){ openSheet(item.dataset.ev); return; }
  if(ev.target.id==='scrim') closeSheet();
});
document.getElementById('q').addEventListener('input', e=>{ state.q=e.target.value.trim(); if(state.view==='grid'||state.view==='list') render(); });
document.getElementById('sectionSel').addEventListener('change', e=>{ state.section=e.target.value; render(); });
document.getElementById('breaksBtn').addEventListener('click', e=>{ state.breaks=!state.breaks; e.currentTarget.setAttribute('aria-pressed',String(state.breaks)); render(); });
document.getElementById('onlyPlanBtn').addEventListener('click', e=>{ state.onlyPlan=!state.onlyPlan; e.currentTarget.setAttribute('aria-pressed',String(state.onlyPlan)); render(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

header(); render();
let wasNarrow = narrow();
addEventListener('resize', ()=>{ if(narrow()!==wasNarrow){ wasNarrow=narrow(); header(); render(); } });
</script>
